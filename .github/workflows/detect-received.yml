name: Detect formal Packhai receipts
on:
  schedule:
    - cron: '50 16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'in_transit_batches/**'
permissions:
  contents: write
concurrency:
  group: build-in-transit
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - run: python -m unittest discover -s tests -v
      - name: Snapshot, detect and regenerate
        env:
          PACKHAI_TOKEN: ${{ secrets.PACKHAI_TOKEN }}
        run: |
          git pull --ff-only origin main
          python -m scripts.detect_received
          if [ -z "$(git status --porcelain -- in_transit.json in_transit_batches stock_snapshots)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add in_transit.json in_transit_batches stock_snapshots
          git commit -m "chore: record Packhai snapshots and detected receipts [skip ci]"
          # Fail on a concurrent edit; never overwrite a newer batch or replay stale results.
          git push origin HEAD:main
